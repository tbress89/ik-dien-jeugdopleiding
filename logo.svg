<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B388A"/>
      <stop offset="50%" stop-color="#4E2F75"/>
      <stop offset="100%" stop-color="#3A1E5C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#220F38" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crown for "Koninklijke" -->
  <g filter="url(#shadow)">
    <!-- Crown Base -->
    <path d="M 65 38 L 135 38 L 131 43 L 69 43 Z" fill="#FFFFFF"/>
    <!-- Crown Spikes -->
    <path d="M 66 38 L 56 18 L 80 30 L 100 12 L 120 30 L 144 18 L 134 38 Z" fill="#FFFFFF" stroke="#4E2F75" stroke-width="1.5"/>
    <!-- Crown Jewels / dots -->
    <circle cx="56" cy="17" r="3.5" fill="#4E2F75"/>
    <circle cx="80" cy="29" r="3" fill="#4E2F75"/>
    <circle cx="100" cy="11" r="4" fill="#4E2F75"/>
    <circle cx="120" cy="29" r="3" fill="#4E2F75"/>
    <circle cx="144" cy="17" r="3.5" fill="#4E2F75"/>
  </g>

  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Border (White) -->
    <path d="M 30 46 C 70 41, 130 41, 170 46 C 170 95, 172 155, 100 215 C 28 155, 30 95, 30 46 Z"
          fill="#FFFFFF" stroke="#4E2F75" stroke-width="2"/>

    <!-- Main Shield Body (Purple) -->
    <path d="M 36 52 C 72 48, 128 48, 164 52 C 164 97, 166 150, 100 206 C 34 150, 36 97, 36 52 Z"
          fill="url(#shieldGrad)"/>
  </g>

  <!-- Inner Stripes in Background -->
  <g clip-path="url(#shieldClip)">
    <clipPath id="shieldClip">
      <path d="M 36 52 C 72 48, 128 48, 164 52 C 164 97, 166 150, 100 206 C 34 150, 36 97, 36 52 Z"/>
    </clipPath>
    <!-- White vertical stripes -->
    <rect x="82" y="45" width="36" height="170" fill="#FFFFFF" opacity="0.12"/>
    <rect x="92" y="45" width="16" height="170" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- Inner Crest Content -->
  <!-- Top Banner / Text "K. IK DIEN" -->
  <text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" letter-spacing="2.5">K. IK DIEN</text>
  <text x="100" y="96" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="3" opacity="0.9">F.C.</text>

  <!-- Decorative Divider Line -->
  <line x1="60" y1="104" x2="140" y2="104" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Football Graphic in center -->
  <g transform="translate(100, 135)">
    <!-- Ball circle -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#4E2F75" stroke-width="2"/>
    <!-- Center pentagon -->
    <polygon points="0,-6.5 6.2,-2 3.8,5.5 -3.8,5.5 -6.2,-2" fill="#4E2F75"/>
    <!-- Seam lines -->
    <line x1="0" y1="-6.5" x2="0" y2="-14" stroke="#4E2F75" stroke-width="1.6"/>
    <line x1="6.2" y1="-2" x2="13.5" y2="-5" stroke="#4E2F75" stroke-width="1.6"/>
    <line x1="3.8" y1="5.5" x2="9" y2="12.5" stroke="#4E2F75" stroke-width="1.6"/>
    <line x1="-3.8" y1="5.5" x2="-9" y2="12.5" stroke="#4E2F75" stroke-width="1.6"/>
    <line x1="-6.2" y1="-2" x2="-13.5" y2="-5" stroke="#4E2F75" stroke-width="1.6"/>
    <!-- Outer patches -->
    <path d="M -7 -19 C -4 -21, 4 -21, 7 -19 L 0 -14 Z" fill="#4E2F75"/>
    <path d="M 17 -11 C 20 -8, 21 -1, 19 3 L 13.5 -5 Z" fill="#4E2F75"/>
    <path d="M 13 16 C 9 19, 3 21, -1 21 L 9 12.5 Z" fill="#4E2F75"/>
    <path d="M -13 16 C -9 19, -3 21, 1 21 L -9 12.5 Z" fill="#4E2F75"/>
    <path d="M -17 -11 C -20 -8, -21 -1, -19 3 L -13.5 -5 Z" fill="#4E2F75"/>
  </g>

  <!-- Banner / Year Est. 1954 -->
  <g transform="translate(100, 180)">
    <rect x="-40" y="-9" width="80" height="18" rx="9" fill="#FFFFFF"/>
    <text x="0" y="4" text-anchor="middle" fill="#4E2F75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1">EST. 1954</text>
  </g>
</svg>
